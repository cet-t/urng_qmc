[package]
name = "urng_qmc"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
keywords = ["no_std", "qmc", "sobol", "low-discrepancy"]
categories = ["no-std", "algorithms", "mathematics"]
description = "Quasi-random (low-discrepancy) sequences for urng_core: Weyl, R_d, van der Corput, Sobol, Halton"
readme = "crates-readme.md"
authors = ["cet"]
repository = "https://github.com/cet-t/urng_qmc"
license = "MIT OR Apache-2.0"
exclude = ["/.github", "/docs", "/tools"]

[dependencies]
urng_core = "0.1.2"
urng_qmc_core = { version = "0.1", path = "../urng_qmc_core" }

[features]
default = []
# SobolWide32/64: Sobol with all 21201 Joe-Kuo dimensions (Sobol32/64 stop at 1024).
sobol-21201 = []

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "points"
harness = false

[package.metadata.docs.rs]
all-features = true
